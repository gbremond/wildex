name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # 66 MB from HuggingFace on every run would make their outages our outages.
      # No restore-keys: a partial hit would leave stale weights on disk, which
      # fetch-birdnet.mjs treats as already downloaded and skips.
      - uses: actions/cache@v4
        with:
          path: |
            static/models/birdnet/*.onnx
            static/models/birdnet/labels.txt
          key: birdnet-models-${{ hashFiles('scripts/fetch-birdnet.mjs') }}
      # Must run after `npm ci`: the script also copies the onnxruntime-web
      # runtime out of node_modules. On a cache hit it only does that copy.
      - run: npm run fetch:birdnet
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
